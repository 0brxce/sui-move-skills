interface:
  display_name: "Sui Move Auditor"
  short_description: "Audit Sui Move contracts with validated findings"
  default_prompt: "Use $sui-move-auditor to audit this Sui Move package autonomously, continue until the final report has been written to audit-report.md, validate each candidate against reachability, capability obtainability, ownership rules, and abort semantics, keep rejected candidates out of findings, stay strictly in static analysis unless the user explicitly requests otherwise, do not run tests or package commands such as sui move test or sui move build, and do not suggest, recommend, or ask the user to approve any shell command during the default audit flow."

policy:
  allow_implicit_invocation: false
